services:
  - type: web
    name: courseforge
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python web_app.py"
    envVars:
      - key: PORT
        value: 8000
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
